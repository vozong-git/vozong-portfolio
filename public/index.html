<!DOCTYPE html>

<body class="bg-background text-on-surface font-body-md min-h-screen selection:bg-primary-container selection:text-on-primary-container">

<!-- SideNav -->
<nav id="sideNav" class="flex flex-col h-full py-stack-md bg-surface-container fixed left-0 top-0 w-64 border-r border-outline-variant z-50 -translate-x-full md:translate-x-0 transition-transform duration-200">
  <div class="px-4 mb-8">
    <h1 class="font-display-lg text-headline-lg-mobile text-primary-fixed-dim whitespace-nowrap">Kim, Bojong</h1>
    <p class="font-metadata-sm text-metadata-sm text-on-surface-variant mt-2">Senior Sound Engineer</p>
  </div>
  <div class="flex-1 overflow-y-auto flex flex-col gap-1" id="catNav">
    <a data-cat="" class="nav-item bg-primary-container/10 text-primary-fixed-dim border-l-4 border-primary-fixed-dim px-4 py-3 flex items-center gap-3" href="#">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">dashboard</span>
      <span class="font-label-caps text-label-caps">Overview</span></a>
    <a data-cat="studio" class="nav-item text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all duration-150 inner-glow" href="#">
      <span class="material-symbols-outlined">equalizer</span><span class="font-label-caps text-label-caps">Studio Work</span></a>
    <a data-cat="playback" class="nav-item text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all duration-150 inner-glow" href="#">
      <span class="material-symbols-outlined">settings_voice</span><span class="font-label-caps text-label-caps">Playback &amp; Live Tune</span></a>
    <a data-cat="live" class="nav-item text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all duration-150 inner-glow" href="#">
      <span class="material-symbols-outlined">settings_input_component</span><span class="font-label-caps text-label-caps">Live Sound</span></a>
  </div>
  <div class="mt-auto px-4 flex flex-col gap-1 pt-4 border-t border-outline-variant">
    <a class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow" href="/contact.html">
      <span class="material-symbols-outlined">mail</span><span class="font-label-caps text-label-caps">Contact</span></a>
    <a id="adminLink" hidden class="text-primary-fixed-dim px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow" href="/admin.html">
      <span class="material-symbols-outlined">admin_panel_settings</span><span class="font-label-caps text-label-caps">Admin</span></a>
  </div>
</nav>

<main class="flex-1 md:ml-64 p-gutter max-w-container-max mx-auto w-full">
  <header style="transform:translateZ(0);-webkit-transform:translateZ(0)" class="md:hidden sticky top-0 z-30 bg-background pt-3 flex justify-between items-center w-full pb-stack-sm mb-stack-md border-b border-outline-variant">
    <h1 class="font-display-lg text-headline-lg-mobile text-primary-fixed-dim">Kim, Bojong</h1>
  </header>

  <header class="mb-stack-lg flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Sound Engineer Portfolio</h2>
      <div class="flex gap-4 font-metadata-sm text-metadata-sm text-on-surface-variant">
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">folder_open</span> Total Projects: <span id="totalCount">—</span></span>
      </div>
    </div>
  </header>

  <div id="projectArea" class="flex flex-col gap-stack-lg">
    <p class="font-metadata-sm text-metadata-sm text-on-surface-variant">Loading…</p>
  </div>
</main>

<script src="/assets/common.js"></script>
<script>
(async () => {
  const me = await SN.me();
  if (me.isAdmin) document.getElementById('adminLink').hidden = false;

  let activeCat = '';
  const area = document.getElementById('projectArea');
  const CATS = [
    { key: 'studio', label: 'Studio Work' },
    { key: 'playback', label: 'Playback & Live Tune' },
    { key: 'live', label: 'Live Sound' },
  ];

  function setActive(cat) {
    document.querySelectorAll('.nav-item').forEach(a => {
      const on = (a.dataset.cat || '') === cat;
      a.classList.toggle('bg-primary-container/10', on);
      a.classList.toggle('text-primary-fixed-dim', on);
      a.classList.toggle('border-l-4', on);
      a.classList.toggle('border-primary-fixed-dim', on);
      a.classList.toggle('text-on-surface-variant', !on);
    });
  }

  function section(label, projects) {
    const body = projects.length
      ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${projects.map(SN.projectCard).join('')}</div>`
      : `<p class="font-metadata-sm text-metadata-sm text-outline pl-1">No projects yet.</p>`;
    return `
      <section class="flex flex-col gap-4">
        <h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-widest border-b border-outline-variant pb-2">${SN.escape(label).toUpperCase()}</h3>
        ${body}
      </section>`;
  }

  async function load(cat) {
    activeCat = cat; setActive(cat);
    area.innerHTML = `<p class="font-metadata-sm text-metadata-sm text-on-surface-variant">Loading…</p>`;
    try {
      const url = '/api/projects' + (cat ? `?category=${cat}` : '');
      const { projects } = await SN.api('GET', url);
      document.getElementById('totalCount').textContent = projects.length;
      if (cat) {
        area.innerHTML = section(SN.CATEGORY_LABELS[cat] || cat, projects);
      } else {
        // Overview: one section per category, always shown, in order
        let html = CATS.map(c => section(c.label, projects.filter(p => p.category === c.key))).join('');
        const others = projects.filter(p => !CATS.some(c => c.key === p.category));
        if (others.length) html += section('Other', others);
        area.innerHTML = html;
      }
    } catch (e) {
      area.innerHTML = `<p class="font-metadata-sm text-metadata-sm text-error">${SN.escape(e.message)}</p>`;
    }
  }

  document.getElementById('catNav').addEventListener('click', (e) => {
    const a = e.target.closest('.nav-item'); if (!a) return;
    e.preventDefault(); load(a.dataset.cat || '');
  });

  // ── project detail (open on card click, return via Back) ──
  area.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('article[data-id]');
    if (card) { e.preventDefault(); openDetail(card.dataset.id); }
  });
  area.addEventListener('click', (e) => {
    const card = e.target.closest('article[data-id]');
    if (card) { openDetail(card.dataset.id); return; }
    if (e.target.closest('#backBtn')) { load(activeCat); return; }
    const thumb = e.target.closest('button[data-img]');
    if (thumb) {
      const m = document.getElementById('detailMain'); if (m) m.src = thumb.dataset.img + '?thumb=800';
      const bg = document.getElementById('detailBg'); if (bg) bg.src = thumb.dataset.img + '?thumb=160';
    }
  });

  function ytId(url) {
    if (!url) return null;
    const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([\w-]{11})/);
    return m ? m[1] : null;
  }

  async function openDetail(id) {
    area.innerHTML = `<p class="font-metadata-sm text-metadata-sm text-on-surface-variant">Loading…</p>`;
    try {
      const { project: p } = await SN.api('GET', `/api/projects/${id}`);
      area.innerHTML = detailView(p);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // No embedded video → try to resolve the real watch link in the background
      if (!ytId(p.youtube_url)) enhanceYouTubeLink(p.id);
    } catch (e) {
      area.innerHTML = `<p class="font-metadata-sm text-metadata-sm text-error">${SN.escape(e.message)}</p>`;
    }
  }

  // Upgrade the "YouTube에서 검색" fallback into a direct watch-page link once
  // the backend resolves the project's video id (no-op if unresolved/no key).
  async function enhanceYouTubeLink(projectId) {
    const a = document.getElementById('ytLink');
    if (!a) return;
    try {
      const r = await SN.api('GET', `/api/youtube/resolve?projectId=${projectId}`);
      if (r && r.videoId) {
        a.href = `https://www.youtube.com/watch?v=${r.videoId}`;
        const label = document.getElementById('ytLinkLabel');
        if (label) label.textContent = 'YouTube에서 보기';
        const icon = a.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = 'play_circle';
      }
    } catch (_) { /* keep the search fallback */ }
  }

  function detailView(p) {
    const images = (p.assets || []).filter(a => a.kind === 'image');
    const audios = (p.assets || []).filter(a => a.kind === 'audio');
    const yt = ytId(p.youtube_url);
    // No saved video? Offer a YouTube search for "artist title" (opens in a new
    // tab — YouTube blocks embedding its search results in an iframe).
    const searchQ = encodeURIComponent([p.client_name, p.title].filter(Boolean).join(' ').trim());
    // Embed inline, but always offer a watch-page link below: many official
    // performance videos disable embedding and error in the inline player —
    // the same video plays fine on its full YouTube watch page.
    const ytBlock = yt
      ? `<div class="flex flex-col gap-2">
           <div class="aspect-video bg-black rounded overflow-hidden border border-outline-variant inner-glow"><iframe src="https://www.youtube.com/embed/${yt}" class="w-full h-full" title="YouTube video" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
           <a href="https://www.youtube.com/watch?v=${yt}" target="_blank" rel="noopener"
              class="flex items-center justify-center gap-2 font-metadata-sm text-metadata-sm text-on-surface-variant hover:text-primary-fixed-dim transition-colors">
              <span class="material-symbols-outlined text-base">open_in_new</span> 영상이 안 보이면 YouTube에서 보기</a>
         </div>`
      : (searchQ
        // Starts as a plain search link (always works); openDetail() then asks
        // the backend to resolve the exact video and upgrades this to a direct
        // watch-page link, which plays even embedding-disabled videos.
        ? `<a id="ytLink" href="https://www.youtube.com/results?search_query=${searchQ}" target="_blank" rel="noopener"
             class="flex items-center justify-center gap-2 bg-surface-container border border-outline-variant rounded py-3 font-label-caps text-label-caps text-on-surface-variant hover:text-primary-fixed-dim hover:border-primary-fixed-dim transition-colors">
             <span class="material-symbols-outlined text-base">smart_display</span> <span id="ytLinkLabel">YouTube에서 검색</span></a>`
        : '');
    const mainSrc = p.cover_url || (images[0] && images[0].url) || '';
    // Blurred copy of the same image fills the letterbox so every cover —
    // square, portrait, landscape — looks intentional with no empty frame.
    const gallery = mainSrc
      ? `<img id="detailBg" src="${mainSrc}?thumb=160" alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover scale-110 blur-2xl opacity-40"/>
         <img id="detailMain" src="${mainSrc}?thumb=800" alt="${SN.escape(p.title)}" decoding="async" class="relative w-full h-full object-contain"/>`
      : `<span class="material-symbols-outlined text-5xl text-outline">graphic_eq</span>`;
    const thumbs = images.length > 1
      ? `<div class="grid grid-cols-5 gap-2">${images.map(a => `
          <button data-img="${a.url}" class="aspect-square bg-surface-container-lowest border border-outline-variant rounded overflow-hidden hover:border-primary-fixed-dim transition-colors">
            <img src="${a.url}?thumb=160" alt="" loading="lazy" decoding="async" class="w-full h-full object-cover"/></button>`).join('')}</div>`
      : '';
    const audioBlock = audios.length
      ? `<div class="flex flex-col gap-2">${audios.map(a => `
          <div class="bg-surface-container border border-outline-variant rounded p-3">
            <p class="font-metadata-sm text-[11px] text-on-surface-variant mb-2 truncate flex items-center gap-2"><span class="material-symbols-outlined text-sm text-primary-fixed-dim">graphic_eq</span>${SN.escape(a.file_name)}</p>
            <audio controls preload="none" src="${a.url}" class="w-full"></audio></div>`).join('')}</div>`
      : '';
    const specs = p.technical_specs ? p.technical_specs.split(',').map(s => s.trim()).filter(Boolean) : [];
    const specBlock = specs.length
      ? `<div class="flex flex-col gap-2"><p class="font-label-caps text-[10px] text-outline tracking-widest">HARDWARE / SOFTWARE</p>
           <div class="flex flex-wrap gap-1">${specs.map(s => `<span class="bg-surface-container-lowest border border-outline-variant text-on-surface-variant px-2 py-0.5 rounded font-metadata-sm text-[11px]">${SN.escape(s)}</span>`).join('')}</div></div>`
      : '';
    const descBlock = p.description
      ? `<div class="flex flex-col gap-2"><p class="font-label-caps text-[10px] text-outline tracking-widest">NOTES</p>
           <p class="font-body-md text-body-md text-on-surface-variant whitespace-pre-wrap">${SN.escape(p.description)}</p></div>`
      : '';
    return `
      <div class="flex flex-col gap-stack-md">
        <button id="backBtn" class="self-start flex items-center gap-2 font-label-caps text-label-caps text-on-surface-variant hover:text-primary-fixed-dim transition-colors">
          <span class="material-symbols-outlined text-base">arrow_back</span> Back to list
        </button>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-stack-md">
          <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="relative aspect-video bg-surface-container-lowest border border-outline-variant rounded inner-glow overflow-hidden flex items-center justify-center">${gallery}</div>
            ${thumbs}
            ${audioBlock}
            ${ytBlock}
          </div>
          <div class="lg:col-span-1 flex flex-col gap-stack-sm">
            <div>
              <span class="font-metadata-sm text-metadata-sm text-primary-fixed-dim">${SN.escape(p.client_name || '—')}</span>
              <h2 class="font-headline-lg text-headline-lg text-on-surface mt-1">${SN.escape(p.title)}</h2>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <span class="bg-primary-container/10 text-primary-fixed-dim border-l-2 border-primary-fixed-dim px-2 py-0.5 font-label-caps text-[10px] rounded-r">${SN.escape(SN.catLabel(p)).toUpperCase()}</span>
              ${(p.tags && p.tags.length) ? p.tags.map(SN.tagChip).join('') : ''}
            </div>
            ${p.completion_date ? `<p class="font-metadata-sm text-metadata-sm text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-sm">event</span> ${SN.escape(p.completion_date)}</p>` : ''}
            ${specBlock}
            ${descBlock}
          </div>
        </div>
      </div>`;
  }

  // deep link: /?project=<id> opens that project's detail directly (admins can
  // preview drafts this way from the dashboard; also a shareable detail link).
  const previewId = new URLSearchParams(location.search).get('project');
  if (previewId) openDetail(previewId);
  else load('');
})();
</script>
</body>
</html>
