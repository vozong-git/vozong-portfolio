<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<title>Admin Access — Kim, Bojong</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link href="/assets/app.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center console-grid selection:bg-primary-container selection:text-on-primary-container p-6">

<div class="w-full max-w-md bg-surface-container border border-outline-variant rounded-xl inner-glow p-8 flex flex-col items-center">
  <div class="w-16 h-16 rounded-lg bg-surface-container-lowest border border-outline-variant flex items-center justify-center relative mb-6">
    <span class="material-symbols-outlined text-primary-fixed-dim glow-bloom rounded-full">graphic_eq</span>
  </div>

  <h1 class="font-display-lg text-headline-lg text-on-surface">Kim, Bojong</h1>
  <p class="font-metadata-sm text-metadata-sm text-on-surface-variant mt-2 mb-1">SECURE ADMIN TERMINAL</p>
  <div class="h-px w-12 bg-primary-fixed-dim/60 mb-8"></div>

  <p id="errBox" hidden class="w-full mb-6 px-4 py-3 rounded bg-error-container/20 text-on-error-container border-l-2 border-error font-metadata-sm text-metadata-sm"></p>

  <a href="/api/auth/google"
     class="w-full bg-on-surface text-surface hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-all font-label-caps text-label-caps py-3 px-6 rounded flex items-center justify-center gap-3 glow-bloom">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </a>

  <p class="font-metadata-sm text-[11px] text-outline mt-6 text-center leading-relaxed">
    Access restricted to the registered administrator account.<br>Unauthorized accounts are rejected automatically.
  </p>
  <a href="/" class="font-metadata-sm text-metadata-sm text-on-surface-variant hover:text-primary-fixed-dim mt-6 flex items-center gap-1">
    <span class="material-symbols-outlined text-sm">arrow_back</span> Return to portfolio
  </a>
</div>

<script>
  const ERRORS = {
    not_authorized: 'This Google account is not authorized for admin access.',
    email_unverified: 'Your Google email is not verified.',
    bad_state: 'Session expired or invalid request. Please try again.',
    oauth_failed: 'Google sign-in failed. Please try again.',
    missing_code: 'Sign-in was cancelled.',
  };
  const params = new URLSearchParams(location.search);
  const err = params.get('error');
  if (err) {
    const box = document.getElementById('errBox');
    box.textContent = ERRORS[err] || ('Sign-in error: ' + err);
    box.hidden = false;
  }
</script>
</body>
</html>
