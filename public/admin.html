<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<title>Dashboard — Kim, Bojong</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link href="/assets/app.css" rel="stylesheet"/>
<script src="/theme.js"></script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">

<nav id="sideNav" class="flex flex-col h-full py-stack-md bg-surface-container fixed left-0 top-0 w-64 border-r border-outline-variant z-50 -translate-x-full md:translate-x-0 transition-transform duration-200">
  <div class="px-4 mb-8">
    <h1 class="font-display-lg text-headline-lg-mobile text-primary-fixed-dim whitespace-nowrap">Kim, Bojong</h1>
    <p class="font-metadata-sm text-metadata-sm text-on-surface-variant mt-2">Senior Sound Engineer</p>
  </div>
  <div class="flex-1 overflow-y-auto flex flex-col gap-1">
    <a class="bg-primary-container/10 text-primary-fixed-dim border-l-4 border-primary-fixed-dim px-4 py-3 flex items-center gap-3" href="/admin.html">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">dashboard</span><span class="font-label-caps text-label-caps">Overview</span></a>
    <a class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow" href="/project-form.html">
      <span class="material-symbols-outlined">add_circle</span><span class="font-label-caps text-label-caps">New Project</span></a>
    <a class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow" href="/contact-form.html">
      <span class="material-symbols-outlined">contact_mail</span><span class="font-label-caps text-label-caps">Edit Contact</span></a>
    <a class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow" href="/" target="_blank">
      <span class="material-symbols-outlined">visibility</span><span class="font-label-caps text-label-caps">Public View</span></a>
  </div>
  <div class="mt-auto px-4 flex flex-col gap-1 pt-4 border-t border-outline-variant">
    <div class="px-4 pt-1 pb-2">
      <p class="font-label-caps text-[10px] text-outline tracking-widest mb-2">THEME</p>
      <div id="themePicker" class="flex gap-2"></div>
    </div>
    <div id="who" class="px-4 py-2 font-metadata-sm text-[11px] text-outline truncate"></div>
    <a id="driveStatus" class="px-4 py-2 font-metadata-sm text-[11px] flex items-center gap-2"></a>
    <button id="backupBtn" class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow text-left">
      <span class="material-symbols-outlined">backup</span><span class="font-label-caps text-label-caps">Backup DB</span></button>
    <button id="logoutBtn" class="text-on-surface-variant px-4 py-3 flex items-center gap-3 hover:bg-surface-container-high transition-all inner-glow text-left">
      <span class="material-symbols-outlined">logout</span><span class="font-label-caps text-label-caps">Logout</span></button>
  </div>
</nav>

<main class="flex-1 md:ml-64 p-gutter max-w-container-max mx-auto">
  <!-- header + filters stay pinned on desktop; only the table below scrolls -->
  <div class="md:sticky md:top-0 md:z-20 bg-background md:pt-4 md:shadow-[0_8px_10px_-8px_rgba(60,50,40,0.15)]">
  <header class="mb-4 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Sound Engineer Portfolio</h2>
      <div class="flex gap-4 font-metadata-sm text-metadata-sm text-on-surface-variant">
        <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">folder_open</span> Total Projects: <span id="totalCount">—</span></span>
      </div>
    </div>
    <a href="/project-form.html" class="bg-primary-fixed-dim/10 text-primary-fixed-dim border border-primary-fixed-dim font-label-caps text-label-caps py-2 px-6 rounded hover:bg-primary-fixed-dim hover:text-on-primary-fixed transition-all flex items-center justify-center gap-2 glow-bloom">
      <span class="material-symbols-outlined text-sm">add_circle</span> Quick Add
    </a>
  </header>

    <div class="flex flex-col gap-3 border-b border-outline-variant pb-3">
      <div class="flex items-center justify-between gap-4 flex-wrap">
        <h3 class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">RECENT HISTORY MANAGEMENT</h3>
        <div class="flex gap-2" id="filterTabs">
          <button data-f="" class="ftab font-label-caps text-[10px] px-3 py-1 rounded text-primary-fixed-dim bg-primary-container/10 border border-primary-fixed-dim">ALL</button>
          <button data-f="published" class="ftab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">PUBLISHED</button>
          <button data-f="draft" class="ftab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">DRAFT</button>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap" id="catTabs">
        <button data-c="" class="ctab font-label-caps text-[10px] px-3 py-1 rounded text-primary-fixed-dim bg-primary-container/10 border border-primary-fixed-dim">ALL TYPES</button>
        <button data-c="studio" class="ctab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">STUDIO WORK</button>
        <button data-c="playback" class="ctab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">PLAYBACK &amp; LIVE TUNE</button>
        <button data-c="live" class="ctab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">LIVE SOUND</button>
      </div>
      <div class="flex gap-2 flex-wrap" id="youtubeTabs">
        <button data-y="" class="ytab font-label-caps text-[10px] px-3 py-1 rounded text-primary-fixed-dim bg-primary-container/10 border border-primary-fixed-dim">ALL YOUTUBE</button>
        <button data-y="with" class="ytab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">YOUTUBE 있음</button>
        <button data-y="without" class="ytab font-label-caps text-[10px] px-3 py-1 rounded text-on-surface-variant border border-outline-variant">YOUTUBE 없음</button>
      </div>
    </div>
    </div>
    <div class="overflow-x-auto border border-outline-variant rounded bg-surface-container inner-glow mt-4">
      <table class="admin-table w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-outline-variant bg-surface-container-low font-label-caps text-label-caps text-on-surface-variant">
            <th class="px-3 py-3 md:p-4 font-normal whitespace-nowrap">DATE</th>
            <th class="px-3 py-3 md:p-4 font-normal">PROJECT NAME</th>
            <th class="p-4 font-normal hidden lg:table-cell">ARTIST</th>
            <th class="p-4 font-normal hidden lg:table-cell">TYPE</th>
            <th class="px-3 py-3 md:p-4 font-normal">STATUS</th>
            <th class="px-3 py-3 md:p-4 font-normal text-right">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="font-metadata-sm text-metadata-sm">
          <tr><td colspan="6" class="p-6 text-center text-on-surface-variant">Loading…</td></tr>
        </tbody>
      </table>
    </div>
</main>

<script src="/assets/common.js"></script>
<script>
(async () => {
  const me = await SN.me();
  if (!me.isAdmin) { location.href = '/login.html'; return; }
  document.getElementById('who').textContent = me.email;

  // drive link status
  try {
    const h = await SN.api('GET', '/api/health');
    const el = document.getElementById('driveStatus');
    if (h.driveLinked) {
      el.className = 'px-4 py-2 font-metadata-sm text-[11px] flex items-center gap-2 text-success';
      el.innerHTML = '<span class="material-symbols-outlined text-sm">cloud_done</span> Drive linked';
    } else {
      el.className = 'px-4 py-2 font-metadata-sm text-[11px] flex items-center gap-2 text-secondary';
      el.innerHTML = '<span class="material-symbols-outlined text-sm">cloud_off</span> Drive not linked';
    }
  } catch (_) {}

  // theme picker — site-wide accent preset (light/dark variants are automatic)
  try {
    const { theme, themes } = await SN.api('GET', '/api/theme');
    const wrap = document.getElementById('themePicker');
    const paint = (active) => {
      wrap.innerHTML = themes.map((t) => `
        <button type="button" data-theme-key="${t.key}" title="${t.label}" aria-label="${t.label}"
          aria-pressed="${t.key === active}"
          class="w-7 h-7 rounded-full border-2 transition-transform hover:scale-110 ${t.key === active ? 'border-on-surface scale-110' : 'border-outline-variant'}"
          style="background:${t.swatch}"></button>`).join('');
    };
    paint(theme);
    document.documentElement.dataset.theme = theme;
    wrap.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-theme-key]');
      if (!btn) return;
      const key = btn.dataset.themeKey;
      const prev = document.documentElement.dataset.theme;
      document.documentElement.dataset.theme = key; paint(key); // optimistic
      try { await SN.api('PUT', '/api/theme', { theme: key }); SN.toast(`Theme: ${key}`); }
      catch (err) { document.documentElement.dataset.theme = prev; paint(prev); SN.toast(err.message || 'Theme change failed', 'err'); }
    });
  } catch (_) {}

  let filter = '';
  let catFilter = '';
  let youtubeFilter = '';
  const TYPE_COLOR = { live: 'text-secondary-container', playback: 'text-tertiary-container' };

  function statusChip(s) {
    return s === 'published'
      ? `<span class="bg-primary-container/10 text-primary-fixed-dim border-l-2 border-primary-fixed-dim px-2 py-1 rounded-r">PUBLISHED</span>`
      : `<span class="bg-surface-variant text-on-surface-variant border-l-2 border-outline px-2 py-1 rounded-r">DRAFT</span>`;
  }

  function row(p) {
    const typeColor = TYPE_COLOR[p.category] || 'text-on-surface-variant';
    return `<tr class="border-b border-outline-variant hover:bg-surface-container-high transition-colors" data-id="${p.id}">
      <td data-col="date" class="px-3 py-3 md:p-4 text-on-surface-variant whitespace-nowrap">${SN.escape(p.completion_date || p.created_at?.slice(0,10) || '')}</td>
      <td data-col="name" class="px-3 py-3 md:p-4 text-on-surface font-semibold break-words">
        <div class="flex items-center gap-2 flex-wrap">
          <a href="/?project=${p.id}" target="_blank" rel="noopener" title="상세보기 미리보기 (새 탭)" class="hover:text-primary-fixed-dim hover:underline">${SN.escape(p.title)}</a>
          ${p.youtube_url ? `<a href="${SN.escape(p.youtube_url)}" target="_blank" rel="noopener" title="YouTube 영상 열기" class="hover:opacity-80 shrink-0"><span class="material-symbols-outlined text-[18px] align-middle" style="color:#FF0000">smart_display</span></a>` : ''}
          ${(p.tags || []).map(SN.tagChip).join('')}
        </div>
        <div class="lg:hidden mt-1 font-metadata-sm text-[11px] text-on-surface-variant">${SN.escape(p.client_name || '—')} · ${SN.escape(SN.catLabel(p))}</div>
      </td>
      <td class="p-4 text-on-surface-variant hidden lg:table-cell">${SN.escape(p.client_name || '—')}</td>
      <td class="p-4 ${typeColor} hidden lg:table-cell">${SN.escape(SN.catLabel(p))}</td>
      <td data-col="status" class="px-3 py-3 md:p-4">${statusChip(p.status)}</td>
      <td data-col="actions" class="px-3 py-3 md:p-4 text-right whitespace-nowrap">
        <button data-act="toggle" title="Toggle publish" class="text-outline hover:text-success transition-colors"><span class="material-symbols-outlined text-[18px]">${p.status === 'published' ? 'toggle_on' : 'toggle_off'}</span></button>
        <button data-act="edit" title="Edit" class="text-outline hover:text-primary-fixed-dim transition-colors ml-2"><span class="material-symbols-outlined text-[18px]">edit</span></button>
        <button data-act="del" title="Delete" class="text-outline hover:text-error transition-colors ml-2"><span class="material-symbols-outlined text-[18px]">delete</span></button>
      </td>
    </tr>`;
  }

  const tbody = document.getElementById('tableBody');

  async function load() {
    tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-on-surface-variant">Loading…</td></tr>`;
    const qs = new URLSearchParams();
    if (filter) qs.set('status', filter);
    if (catFilter) qs.set('category', catFilter);
    if (youtubeFilter) qs.set('youtube', youtubeFilter);
    const url = '/api/projects' + (qs.toString() ? `?${qs}` : '');
    const { projects } = await SN.api('GET', url);
    document.getElementById('totalCount').textContent = projects.length;
    tbody.innerHTML = projects.length
      ? projects.map(row).join('')
      : `<tr><td colspan="6" class="p-6 text-center text-on-surface-variant">No projects. <a href="/project-form.html" class="text-primary-fixed-dim">Create one →</a></td></tr>`;
  }

  function styleTabs(selector, activeBtn) {
    const base = selector === '.ftab' ? 'ftab' : selector === '.ctab' ? 'ctab' : 'ytab';
    document.querySelectorAll(selector).forEach(t => {
      const on = t === activeBtn;
      t.className = `${base} font-label-caps text-[10px] px-3 py-1 rounded ` +
        (on ? 'text-primary-fixed-dim bg-primary-container/10 border border-primary-fixed-dim'
            : 'text-on-surface-variant border border-outline-variant');
    });
  }
  // remember the chosen filters so they survive navigating to the editor and back
  function persistFilters() {
    sessionStorage.setItem('admin_filter', filter);
    sessionStorage.setItem('admin_catFilter', catFilter);
    sessionStorage.setItem('admin_youtubeFilter', youtubeFilter);
  }

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ftab'); if (!b) return;
    filter = b.dataset.f; styleTabs('.ftab', b); persistFilters(); load();
  });

  document.getElementById('catTabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ctab'); if (!b) return;
    catFilter = b.dataset.c; styleTabs('.ctab', b); persistFilters(); load();
  });

  document.getElementById('youtubeTabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ytab'); if (!b) return;
    youtubeFilter = b.dataset.y; styleTabs('.ytab', b); persistFilters(); load();
  });

  // restore previously selected filters on load (e.g. after editing a project)
  function restoreFilters() {
    filter = sessionStorage.getItem('admin_filter') || '';
    catFilter = sessionStorage.getItem('admin_catFilter') || '';
    youtubeFilter = sessionStorage.getItem('admin_youtubeFilter') || '';
    const fb = document.querySelector(`.ftab[data-f="${filter}"]`);
    const cb = document.querySelector(`.ctab[data-c="${catFilter}"]`);
    const yb = document.querySelector(`.ytab[data-y="${youtubeFilter}"]`);
    if (fb) styleTabs('.ftab', fb); else filter = '';
    if (cb) styleTabs('.ctab', cb); else catFilter = '';
    if (yb) styleTabs('.ytab', yb); else youtubeFilter = '';
  }
  restoreFilters();

  tbody.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const tr = btn.closest('tr'); const id = tr.dataset.id; const act = btn.dataset.act;
    try {
      if (act === 'edit') { location.href = `/project-form.html?id=${id}`; return; }
      if (act === 'toggle') {
        const isPub = tr.querySelector('[data-act="toggle"] .material-symbols-outlined').textContent === 'toggle_on';
        await SN.api('PATCH', `/api/projects/${id}`, { status: isPub ? 'draft' : 'published' });
        SN.toast(isPub ? 'Set to draft' : 'Published'); load();
      }
      if (act === 'del') {
        if (!confirm('Delete this project and its Drive files? This cannot be undone.')) return;
        await SN.api('DELETE', `/api/projects/${id}`);
        SN.toast('Deleted'); load();
      }
    } catch (err) { SN.toast(err.message, 'err'); }
  });

  document.getElementById('backupBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; SN.toast('Backing up…');
    try {
      const r = await SN.api('POST', '/api/backup');
      SN.toast(`Backed up → ${r.name}`);
    } catch (err) { SN.toast(err.message || 'Backup failed', 'err'); }
    finally { btn.disabled = false; }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await SN.api('POST', '/api/auth/logout'); location.href = '/login.html';
  });

  load();
})();
</script>
</body>
</html>
