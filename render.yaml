# Render Blueprint — Studio Noir Portfolio
# Deploy:  Render Dashboard → New → Blueprint → connect this repo.
# SQLite needs a Persistent Disk, so this uses the (paid) Starter plan.
services:
  - type: web
    name: vozong-portfolio
    runtime: node
    plan: starter            # Persistent Disk requires a paid instance
    region: singapore        # closest Render region to Korea
    branch: main
    autoDeploy: true
    # --include=dev: NODE_ENV=production would otherwise skip devDeps (tailwindcss),
    # breaking the CSS build. We need tailwindcss at build time only.
    buildCommand: npm install --include=dev && npm run build:css
    startCommand: node server.js   # build already ran above; skip prestart double-build
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # SQLite lives on the persistent disk so data survives deploys/restarts
      - key: DB_PATH
        value: /var/data/portfolio.db
      # BASE_URL is derived from RENDER_EXTERNAL_URL automatically (see src/config.js)
      # Secrets are generated once and kept stable by Render
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY     # ⚠ changing this invalidates the stored Drive refresh token
        generateValue: true
      # Fill these in the Render dashboard (kept out of git)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # optional: YouTube Data API v3 key — lets the detail page resolve a
      # project's "artist title" to the real video's watch page. Without it the
      # YouTube button falls back to a plain search link.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DRIVE_IMAGE_FOLDER
        value: portfolio_image
      - key: MAX_UPLOAD_MB
        value: "100"
      # shared secret the backup cron uses to trigger POST /api/backup
      - fromGroup: backup-secrets

  # ── scheduled DB backup ──
  # Cron jobs can't mount the web service's persistent disk, so this doesn't
  # open the DB directly — it calls POST /api/backup on the web service (which
  # has the disk + Drive link), authenticated by the shared BACKUP_TOKEN.
  # Schedule is UTC: 18:00 UTC = 03:00 KST, daily.
  - type: cron
    name: vozong-portfolio-backup
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "0 18 * * *"
    # no native deps needed — trigger-backup.js only uses global fetch
    buildCommand: "true"
    startCommand: node scripts/trigger-backup.js
    envVars:
      - key: BACKUP_URL
        value: https://vozong-portfolio.onrender.com/api/backup
      # optional: Slack/Discord incoming webhook URL — alerts on backup failure
      - key: ALERT_WEBHOOK
        sync: false
      - fromGroup: backup-secrets

# Shared env group so the web service and the cron job use the same token.
envVarGroups:
  - name: backup-secrets
    envVars:
      - key: BACKUP_TOKEN
        generateValue: true
